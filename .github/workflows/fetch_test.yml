name: Fetch Speed Test

# 🧪 تجربة سرعة سحب المواعيد بس (قراية) — مفيش ملفات بتتكتب ولا commit · بتشتغل بإيدك
on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'عدد الصفحات (100 ميعاد للصفحة)'
        required: false
        default: '20'

permissions:
  contents: read

concurrency:
  group: medicolize-sync          # نفس طابور السحب العادي — دخول واحد على Medicolize في المرة
  cancel-in-progress: false

jobs:
  range:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-playwright-${{ runner.os }}
      - name: Install dependencies
        run: pip install playwright cryptography
      - name: Install Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; else python -m playwright install --with-deps chromium; fi
      - name: Restore Medicolize session
        uses: actions/cache@v4
        with:
          path: .session
          key: medicolize-session-${{ github.run_id }}
          restore-keys: medicolize-session-
      - name: Speed test (read only)
        env:
          MEDICOLIZE_URL:  ${{ secrets.MEDICOLIZE_URL }}
          MEDICOLIZE_USER: ${{ secrets.MEDICOLIZE_USER }}
          MEDICOLIZE_PASS: ${{ secrets.MEDICOLIZE_PASS }}
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:  ${{ secrets.GMAIL_APP_PASS }}
          FETCH_TEST: '1'
          FETCH_TEST_PAGES: ${{ github.event.inputs.pages }}
        run: python scraper.py
