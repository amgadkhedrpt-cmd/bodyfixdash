name: plan probe (temporary)
on:
  push:
    paths: ['perf_probe.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: if command -v google-chrome >/dev/null 2>&1; then echo chrome; else python -m playwright install --with-deps chromium; fi
      - env:
          SHEET_KEY: ${{ secrets.SHEET_KEY }}
          SHEET_URL: https://script.google.com/macros/s/AKfycbzZGsDjI5dBNQi5YrD2nFQtlayUmhNmj0PO68nJeqPNL4qhYTqNk-YZJg5obR-gEAA/exec
        run: python perf_probe.py
