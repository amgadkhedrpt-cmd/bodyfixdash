name: dokki probe (temporary)
on:
  push:
    paths: ['dk_probe.py']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cryptography requests playwright
      - env:
          FIN_PASS: ${{ secrets.FIN_PASS }}
          SHEET_KEY: ${{ secrets.SHEET_KEY }}
          SHEET_URL: https://script.google.com/macros/s/AKfycbzZGsDjI5dBNQi5YrD2nFQtlayUmhNmj0PO68nJeqPNL4qhYTqNk-YZJg5obR-gEAA/exec
        run: python dk_probe.py
