name: Medicolize Sync

# سحب واحد لكل الأدوات: الداشبورد + التنبيهات + التحصيل — دخول واحد على Medicolize
on:
  schedule:
    - cron: '*/30 9-19 * * *'   # كل نص ساعة من 11 الصبح لـ 9:30 بالليل بتوقيت مصر (الشتا UTC+2)
    - cron: '0 21 * * *'        # 11 بالليل بتوقيت مصر — سحب أخير + الملخص اليومي بالإيميل
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medicolize-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-playwright-${{ runner.os }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v2

      - name: Install dependencies
        run: pip install playwright cryptography

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore Medicolize session
        uses: actions/cache@v4
        with:
          path: .session
          key: medicolize-session-${{ github.run_id }}
          restore-keys: medicolize-session-

      - name: Run scraper (dashboard + alerts)
        id: dash
        continue-on-error: true
        env:
          MEDICOLIZE_URL:  ${{ secrets.MEDICOLIZE_URL }}
          MEDICOLIZE_USER: ${{ secrets.MEDICOLIZE_USER }}
          MEDICOLIZE_PASS: ${{ secrets.MEDICOLIZE_PASS }}
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:  ${{ secrets.GMAIL_APP_PASS }}
        run: python scraper.py

      - name: Sync collection tool (same Medicolize session)
        id: collect
        if: steps.dash.outcome == 'success'
        continue-on-error: true
        env:
          DRY: "0"
          REM_ONLY: "1"
          MZ_STATE: .session/state.json
          MEDICOLIZE_USER: ${{ secrets.MEDICOLIZE_USER }}
          MEDICOLIZE_PASS: ${{ secrets.MEDICOLIZE_PASS }}
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:  ${{ secrets.GMAIL_APP_PASS }}
          SHEET_KEY:       ${{ secrets.SHEET_KEY }}
          SHEET_URL: https://script.google.com/macros/s/AKfycbzZGsDjI5dBNQi5YrD2nFQtlayUmhNmj0PO68nJeqPNL4qhYTqNk-YZJg5obR-gEAA/exec
        run: python collect_sync.py

      - name: Finance sync (encrypted with the owner's password)
        if: steps.dash.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 13
        env:
          MZ_STATE: .session/state.json
          FIN_PASS:        ${{ secrets.FIN_PASS }}
          MEDICOLIZE_USER: ${{ secrets.MEDICOLIZE_USER }}
          MEDICOLIZE_PASS: ${{ secrets.MEDICOLIZE_PASS }}
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:  ${{ secrets.GMAIL_APP_PASS }}
          SHEET_KEY:       ${{ secrets.SHEET_KEY }}
          SHEET_URL: https://script.google.com/macros/s/AKfycbzZGsDjI5dBNQi5YrD2nFQtlayUmhNmj0PO68nJeqPNL4qhYTqNk-YZJg5obR-gEAA/exec
        run: python fin_sync.py

      - name: Daily email summary (11 PM)
        if: always() && steps.dash.outcome == 'success'
        continue-on-error: true
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          SHEET_KEY:      ${{ secrets.SHEET_KEY }}
          SHEET_URL: https://script.google.com/macros/s/AKfycbzZGsDjI5dBNQi5YrD2nFQtlayUmhNmj0PO68nJeqPNL4qhYTqNk-YZJg5obR-gEAA/exec
        run: python digest.py

      - name: Commit & push data
        if: steps.dash.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appointments.json summary.json data/
          git add alerts.json 2>/dev/null || true
          git add packages.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🔄 sync appointments $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase=false -X ours origin main
          git push origin main

      - name: Report result
        if: always()
        run: |
          echo "dashboard: ${{ steps.dash.outcome }} · collection: ${{ steps.collect.outcome }}"
          test "${{ steps.dash.outcome }}" = "success" -a "${{ steps.collect.outcome }}" = "success"
