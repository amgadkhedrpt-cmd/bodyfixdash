name: Medicolize Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medicolize-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-playwright-${{ runner.os }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v2

      - name: Install dependencies
        run: pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore Medicolize session
        uses: actions/cache@v4
        with:
          path: .session
          key: medicolize-session-${{ github.run_id }}
          restore-keys: medicolize-session-

      - name: Run scraper
        env:
          MEDICOLIZE_URL:  ${{ secrets.MEDICOLIZE_URL }}
          MEDICOLIZE_USER: ${{ secrets.MEDICOLIZE_USER }}
          MEDICOLIZE_PASS: ${{ secrets.MEDICOLIZE_PASS }}
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:  ${{ secrets.GMAIL_APP_PASS }}
        run: python scraper.py

      - name: Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appointments.json summary.json data/
          git add alerts.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🔄 sync appointments $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase=false -X ours origin main
          git push origin main
