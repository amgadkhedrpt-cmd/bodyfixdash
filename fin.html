<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BODYFIX — التحليلات المالية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f4f3ef;--s1:#fcfcfb;--s2:#f0efea;--brd:#e1dfd8;--t1:#0b0b0b;--t2:#52514e;--t3:#8a8984;
--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;
--good:#1a7f37;--bad:#c62828;--warn:#b26a00;--acc:#ec4899}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111110;--s1:#1a1a19;--s2:#232321;--brd:#33322f;--t1:#f0efec;--t2:#c3c2b7;--t3:#8f8e86;
--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--good:#4ade80;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:14px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--s1);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:5}
.logo{font-weight:900;font-size:1.3rem;letter-spacing:-1px}.logo b:first-child{color:#ec4899}.logo b:last-child{color:#06b6d4}
.sub{color:var(--t2);font-size:.8rem}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input,button{font-family:inherit;font-size:.85rem}
select,input[type=month],input[type=search],input[type=password]{padding:6px 9px;border:1px solid var(--brd);border-radius:8px;background:var(--s1);color:var(--t1)}
button{padding:6px 12px;border:1px solid var(--brd);border-radius:8px;background:var(--s1);color:var(--t1);cursor:pointer;font-weight:700}
button.on,button.pri{background:var(--t1);color:var(--s1);border-color:var(--t1)}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--brd);padding-bottom:8px}
.tabs button{border:0;background:transparent;color:var(--t2);padding:7px 11px}
.tabs button.on{background:var(--s2);color:var(--t1);border-radius:8px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.card{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:.95rem}
.card h3 small{font-weight:600;color:var(--t3);font-size:.75rem;margin-inline-start:6px}
.kpi .l{color:var(--t2);font-size:.78rem;font-weight:700}
.kpi .v{font-size:1.55rem;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.kpi .d{font-size:.75rem;color:var(--t3);margin-top:2px}
.up{color:var(--good)}.down{color:var(--bad)}
.ch{position:relative;height:300px}.ch.sm{height:240px}.ch.lg{height:360px}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--brd);text-align:right;white-space:nowrap}
th{color:var(--t2);font-weight:800;background:var(--s2);position:sticky;top:0}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
tr.tot td{font-weight:900;background:var(--s2)}
.tw{overflow:auto;max-height:520px;border:1px solid var(--brd);border-radius:10px}
.neg{color:var(--bad)}
.note{background:var(--s2);border-radius:10px;padding:10px 12px;font-size:.8rem;color:var(--t2);line-height:1.7}
.ins li{margin:4px 0;line-height:1.6}
.chip{display:inline-block;padding:1px 8px;border-radius:20px;font-size:.72rem;font-weight:800;background:var(--s2);color:var(--t2)}
.chip.w{background:rgba(178,106,0,.15);color:var(--warn)}
#lock{max-width:420px;margin:12vh auto;text-align:center}
#lock .card{padding:28px}
#lock input{width:100%;margin:14px 0 10px;padding:10px;font-size:1rem;text-align:center}
#lock button{width:100%;padding:10px}
.err{color:var(--bad);font-size:.85rem;min-height:1.3em;margin-top:8px}
details summary{cursor:pointer;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--t2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}
.muted{color:var(--t3)}
@media print{header .bar,.tabs,button{display:none!important}}
</style>
</head>
<body>
<div id="lock">
  <div class="card">
    <div class="logo"><b>BODY</b><b>FIX</b></div>
    <h2 style="margin:12px 0 4px">🔒 التحليلات المالية</h2>
    <div class="sub">الأرقام مشفّرة. اكتب الباسورد الخاص بيك علشان تتفك على جهازك.</div>
    <form id="lockForm" autocomplete="off">
      <input type="password" id="pw" placeholder="الباسورد" aria-label="الباسورد" autocomplete="current-password">
      <label class="sub" style="display:block;margin-bottom:10px"><input type="checkbox" id="keep"> افتكرني لحد ما أقفل التاب</label>
      <button class="pri" type="submit" id="unlockBtn">افتح</button>
    </form>
    <div class="err" id="lockErr"></div>
  </div>
</div>

<div id="app" hidden>
<header>
  <div class="logo"><b>BODY</b><b>FIX</b></div>
  <div style="flex:1;min-width:160px"><div style="font-weight:800">📊 التحليلات المالية</div><div class="sub" id="asOf"></div></div>
  <div class="bar" style="margin:0">
    <select id="fBranch" aria-label="الفرع"><option value="haram">BODYFIX Center — الهرم</option><option value="dokki">FIX ZONE — الدقي</option><option value="both">الفرعين مع بعض</option></select>
    <label class="sub">من <input type="month" id="fFrom"></label>
    <label class="sub">لحد <input type="month" id="fTo"></label>
    <button data-q="m">الشهر ده</button><button data-q="3">آخر ٣ شهور</button><button data-q="y">السنة دي</button><button data-q="all">الكل</button>
    <button id="lockBtn" title="اقفل">🔒</button>
  </div>
</header>
<div class="wrap">
  <div class="tabs" id="tabs">
    <button data-t="sum" class="on">الملخص</button>
    <button data-t="pl">الأرباح والخسائر</button>
    <button data-t="rev">الإيرادات</button>
    <button data-t="exp">المصروفات</button>
    <button data-t="pts">المرضى والتحويلات</button>
    <button data-t="ret">استمرار المرضى</button>
    <button data-t="apt">المواعيد</button>
    <button data-t="debt">المديونيات</button>
    <button data-t="cash">الخزنة</button>
    <button data-t="dl">التقارير والتنزيل</button>
    <button data-t="data">حالة البيانات</button>
  </div>
  <div id="main"></div>
</div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=(x,d=0)=>x==null||!isFinite(x)?'—':(x<0?'−':'')+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=x=>x==null||!isFinite(x)?'—':(x*100).toFixed(1)+'%';
const pad=n=>String(n).padStart(2,'0');
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const ml=k=>k?MN[+k.slice(5,7)-1]+' '+k.slice(0,4):'';
const mls=k=>k?MN[+k.slice(5,7)-1].slice(0,3)+' '+k.slice(2,4):'';
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SER=()=>[1,2,3,4,5,6,7,8].map(i=>css('--c'+i));
const DAYS=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];
const REFUND_RX=/مردود|refund|استرداد|مرتجع/i, RENT_RX=/ايجار|إيجار|rent/i, SAL_RX=/مرتب|رواتب|salary|اجور|أجور/i;
const METH={CASH:'كاش',CARD:'فيزا / كارت',BANK_TRANSFER:'تحويل بنكي',MOBILE_WALLET:'محفظة / إنستاباي',VOUCHER:'قسيمة',OTHER:'أخرى',BALANCE:'من الرصيد'};
const mName=x=>METH[x]||x;
const BRN={haram:'الهرم',dokki:'الدقي',both:'الفرعين'};
let RAW=null, D=null, S={tab:'sum',b:'haram',from:'',to:''}, CH={};
try{const t=localStorage.getItem('fin_tab');if(t)S.tab=t;const b=localStorage.getItem('fin_b');if(b)S.b=b}catch(e){}

// ---------------- libraries: several sources, loaded without blocking the page ----------------
const LIBS={Chart:['https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js','https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js'],
  XLSX:['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js']};
const LIBP={};
function loadLib(name){if(window[name])return Promise.resolve(true);if(LIBP[name])return LIBP[name];
  LIBP[name]=new Promise(res=>{const urls=LIBS[name].slice();const next=()=>{if(window[name])return res(true);const u=urls.shift();if(!u){delete LIBP[name];return res(false)}
    const sc=document.createElement('script');sc.src=u;sc.async=true;const t=setTimeout(()=>{sc.onload=sc.onerror=null;next()},12000);
    sc.onload=()=>{clearTimeout(t);window[name]?res(true):next()};sc.onerror=()=>{clearTimeout(t);next()};document.head.appendChild(sc)};next()});
  return LIBP[name]}
let CHW=0;function chartReady(){if(CHW)return;CHW=1;loadLib('Chart').then(ok=>{if(ok&&D)render()})}
chartReady();

// ---------------- decrypt ----------------
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function openWith(key,j){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(j.iv)},key,b64(j.data));
  const ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(ds).text());
}
async function fetchEnc(name){
  const urls=['https://raw.githubusercontent.com/amgadkhedrpt-cmd/bodyfixdash/main/data/'+name,'data/'+name];
  for(const u of urls){try{const r=await fetch(u,{cache:'no-cache'});if(r.ok)return await r.json()}catch(e){}}
  return null;
}
function merge(parts){const out={v:1,start:'2024-06',branches:{},kinds:{},at:''};
  for(const o of parts){if(!o)continue;Object.assign(out.branches,o.branches||{});Object.assign(TYPE_MAP,o.types||{});if(o.start)out.start=o.start;if((o.at||'')>out.at)out.at=o.at;
    for(const kd in o.kinds||{})for(const b in o.kinds[kd]){const t=((out.kinds[kd]=out.kinds[kd]||{})[b]=out.kinds[kd][b]||{});Object.assign(t,o.kinds[kd][b])}}
  return out}
async function unlock(pw,saved){
  const say=t=>{const b=$('#unlockBtn');if(b&&pw)b.textContent=t};say('بيحمّل البيانات…');
  const files=await Promise.all(['fin.enc','fin_c.enc'].map(fetchEnc));say('بيفك التشفير…');
  if(!files.some(Boolean))throw new Error('nofile');
  const keys={},parts=[];
  for(const j of files){if(!j)continue;let key;
    if(saved&&saved[j.salt])key=await crypto.subtle.importKey('raw',b64(saved[j.salt]),{name:'AES-GCM'},true,['decrypt']);
    else if(pw)key=await deriveKey(pw,b64(j.salt),j.iter||250000);
    else throw new Error('relock');
    parts.push(await openWith(key,j));
    keys[j.salt]=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))))}
  if(pw&&$('#keep').checked){try{sessionStorage.setItem('fin_k',JSON.stringify(keys))}catch(e){}}
  return merge(parts);
}
$('#lockForm').addEventListener('submit',async e=>{e.preventDefault();const pw=$('#pw').value;if(!pw)return;
  const btn=$('#unlockBtn');btn.disabled=true;btn.textContent='بيفك التشفير…';$('#lockErr').textContent='';
  try{RAW=await unlock(pw);$('#pw').value='';btn.textContent='بيجهّز الأرقام…';await new Promise(r=>setTimeout(r,20));start()}
  catch(err){$('#lockErr').textContent=err.message==='nofile'?'ملف البيانات لسه ما اتعملش — اتأكد إنك ضفت FIN_PASS وإن المزامنة اشتغلت.':'الباسورد غلط.'}
  finally{btn.disabled=false;btn.textContent='افتح'}});
$('#lockBtn').onclick=()=>{try{sessionStorage.removeItem('fin_k')}catch(e){}RAW=null;D=null;location.reload()};
(async()=>{try{const s=JSON.parse(sessionStorage.getItem('fin_k')||'null');if(!s)return;RAW=await unlock(null,s);start()}catch(e){try{sessionStorage.removeItem('fin_k')}catch(x){}}})();

// ---------------- normalise ----------------
const TZC={};
function cairo(v){ // ISO/epoch -> [YYYY-MM-DD, hour, weekday]
  if(v==null||v==='')return null;let iso=typeof v==='number'?new Date(v).toISOString():String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(iso))return [iso,0,new Date(iso+'T12:00:00Z').getUTCDay()];
  const h=iso.slice(0,13);let c=TZC[h];
  if(!c){const d=new Date(iso);if(isNaN(d))return null;const s=d.toLocaleString('sv-SE',{timeZone:'Africa/Cairo',hour12:false});
    const day=s.slice(0,10);c=TZC[h]=[day,+s.slice(11,13),new Date(day+'T12:00:00Z').getUTCDay()]}
  return c}
function colIdx(cols,list){
  for(const n of list){if(n instanceof RegExp){const i=cols.findIndex(c=>n.test(c));if(i>=0)return i}else{const i=cols.indexOf(n);if(i>=0)return i}}
  return -1}
function pick(cols,spec){const o={};for(const k in spec)o[k]=colIdx(cols,spec[k]);return o}
const nm=(r,i)=>i>=0&&r[i]!=null?String(r[i]).trim():'';
const num=(r,i)=>{if(i<0)return 0;const v=r[i];const x=typeof v==='number'?v:parseFloat(String(v??'').replace(/,/g,''));return isFinite(x)?x:0};
const truthy=v=>v===true||v===1||/^(true|yes|1)$/i.test(String(v??''));
function pname(r,c){const a=nm(r,c.fn),b=nm(r,c.ln);return (a+' '+b).trim()||nm(r,c.pn)}

const SP={
 pay:{date:['createdAt','created','date','paidAt','paymentDate'],amt:['amount','paidAmount','value'],
   method:['type','method','paymentMethod','paymentMethod.name','method.name','paymentType'],type2:['type','paymentType'],
   refunded:['refunded','isRefunded',/refund(ed)?$/i],refDate:['refundDate','refundedAt',/refund.*(date|at)/i],
   pid:['patient.referenceId','invoice.patient.referenceId','patient.id',/patient.*referenceId/],fn:['patient.firstName','invoice.patient.firstName',/patient.*firstName/],ln:['patient.lastName','invoice.patient.lastName',/patient.*lastName/],pn:['patient.name','patientName'],
   doc:['doctor.name','appointment.doctor.name',/doctor.*name/],by:['createdBy.name',/createdBy/,'user.name'],inv:['invoice.referenceId','invoice.invoiceId','invoice.id'],
   branch:['branch.name'],treas:['transaction.treasury.publicName','treasury.name',/treasury/],note:['details','notes','note','comment']},
 exp:{date:['createdAt','created','date','paidAt'],amt:['amount','value','total'],
   type:['expenseType','expenseType.name','expense.type',/category/i],info:['expense.name','details','expenseInfo','info','description'],det:['details'],
   method:['type','paymentMethod','method'],by:['createdBy.name','expense.createdBy.name',/createdBy/],branch:['expense.branch.name','branch.name'],treas:['transaction.treasury.publicName',/treasury/],refunded:['refunded']},
 inv:{date:['createdAt'],total:['total'],paid:['paid'],disc:['discount'],pid:['patient.referenceId','patient.id'],fn:['patient.firstName'],ln:['patient.lastName'],pn:['patient.name'],src:['referralSource.name'],doc:['doctor.name'],ref:['referenceId','id']},
 apt:{date:['start'],st:['status'],type:['type'],doc:['doctor.name'],pid:['patient.referenceId','patient.id'],fn:['patient.firstName'],ln:['patient.lastName'],pn:['patient.name'],room:['room.name'],g:['patient.gender']}
};
const ST={CHECKEDIN:'Checked In',INPROGRESS:'In Progress',COMPLETED:'Completed',CONFIRMED:'Confirmed',DELAYED:'Delayed',OPEN:'Open',WAITING:'Waiting',CANCELED:'Canceled',CANCELLED:'Canceled',NOSHOW:'No Show'};
const stName=s=>{const u=String(s||'').toUpperCase().replace(/[^A-Z]/g,'');return ST[u]||String(s||'')};
const TYPE_MAP={"Enum1":"كشف علاج طبيعي","Enum40":"تقييم الجلسه الأخيره","Enum12":"اعادة تقييم","Enum5":"جلسة علاج طبيعي","Enum11":"ج ريكفري","Enum14":"ج حجامه","Enum2":"كشف تغذيه","Enum3":"متابعة تغذيه","Enum4":"متابعة تغذيه اونلاين","Enum6":"جلسة تغذيه","Enum7":"حقن ميزوثيرابي","Enum8":"شوك ويف منطقه واحده","Enum15":"شوك ويف علي منطقتين","Enum29":"شد فقرات","Enum10":"ماجنتك","Enum13":"جلسة علاج طبيعي علي منطقتين","Enum17":"جلسه منزليه","Enum18":"موعد محجوز","Enum19":"العنايه بالبشره","Enum20":"أجهزه","Enum21":"استرداد","Enum22":"تقرير بالحاله","Enum24":"Feedback","Enum25":"الغاء مفاجئ","Enum26":"Cavitation","Enum28":"RF","Enum16":"Cryo","Enum27":"Cryo-blade","Enum9":"Cryo-Air","Enum30":"Excilis","Enum32":"علاج طبيعي اونلاين","Enum31":"حقن مونجارو","Enum33":"متابعه","Enum23":"متابعه انقطاع","Enum34":"منقطع نهائي","Enum35":"شكوي","Enum36":"تصوير","Enum37":"مساج فقرات","Enum38":"تيكار","Enum39":"gym","Enum41":"ليزر","Enum42":"جلسه تصريف ليمفاوي"};
// phone follow-ups, notes and placeholders are not visits
const NOT_VISIT=new Set(['Enum23','Enum33','Enum34','Enum18','Enum24','Enum35','Enum22','Enum21','Enum25']);
const tName=t=>TYPE_MAP[t]||t||'—';

function build(raw){
  const brs=raw.branches||{},K=raw.kinds||{},bname={};for(const k in brs)bname[k]=brs[k].name||k;
  const out={pay:[],exp:[],inv:[],apt:[],warn:[],at:raw.at,months:new Set()};
  const branchOf=(name,fallback)=>{if(!name)return fallback;const u=String(name).toUpperCase().replace(/\s/g,'');return u.includes('FIXZONE')?'dokki':(fallback==='all'?'haram':fallback)};
  for(const kind of ['pay','exp','inv','apt'])for(const b in (K[kind]||{}))for(const m in K[kind][b]){
    const t=K[kind][b][m];if(!t||!t.cols)continue;const c=pick(t.cols,SP[kind]);out.months.add(m);
    for(const r of t.rows){
      const cd=cairo(c.date>=0?r[c.date]:null);const d=cd?cd[0]:m+'-01';const k=d.slice(0,7);
      if(kind==='pay'){const amt=num(r,c.amt);const meth0=nm(r,c.method);const meth=mName(meth0)||'—';
        out.pay.push({b:branchOf(nm(r,c.branch),b),k,d,h:cd?cd[1]:0,w:cd?cd[2]:0,amt,meth,bal:/balance/i.test(meth0),ref:truthy(r[c.refunded]),refd:nm(r,c.refDate).slice(0,10),
          pid:nm(r,c.pid),pn:pname(r,c),doc:nm(r,c.doc)||'—',by:nm(r,c.by)||'—',inv:nm(r,c.inv),tr:nm(r,c.treas),note:nm(r,c.note)})}
      else if(kind==='exp'){if(truthy(r[c.refunded]))continue;const bb=b==='all'?(c.branch>=0?branchOf(nm(r,c.branch),'all'):'all'):b;
        out.exp.push({b:bb,k,d,amt:num(r,c.amt),type:nm(r,c.type)||'غير مصنف',info:[nm(r,c.info),c.det!==c.info?nm(r,c.det):''].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(' — '),meth:mName(nm(r,c.method))||'—',by:nm(r,c.by)||'—',tr:nm(r,c.treas)})}

function inB(x){return S.b==='both'||x.b===S.b}

function expIn(e){if(S.b==='both')return true;return e.b===S.b}
function monthsList(a,b){const o=[];let y=+a.slice(0,4),m=+a.slice(5,7);while(true){const k=y+'-'+pad(m);if(k>b)break;o.push(k);m++;if(m>12){y++;m=1}}return o}
function calcMonth(k){
  const pay=D.pay.filter(p=>p.k===k&&inB(p)),exp=D.exp.filter(e=>e.k===k&&expIn(e)),apt=D.apt.filter(a=>a.k===k&&inB(a));
  const rev=pay.reduce((s,p)=>s+(p.bal?0:p.amt),0),bal=pay.reduce((s,p)=>s+(p.bal?p.amt:0),0);
  const refunds=exp.filter(e=>REFUND_RX.test(e.type)).reduce((s,e)=>s+e.amt,0);
  const opexAll=exp.filter(e=>!REFUND_RX.test(e.type));
  const opex=opexAll.reduce((s,e)=>s+e.amt,0),rent=opexAll.filter(e=>RENT_RX.test(e.type)).reduce((s,e)=>s+e.amt,0),sal=opexAll.filter(e=>SAL_RX.test(e.type)).reduce((s,e)=>s+e.amt,0);
  const net=rev-refunds,profit=net-opex;
  const done=apt.filter(a=>a.st==='Completed');const sessions=done.length;
  const pts=new Set(done.map(a=>a.pid).filter(Boolean)).size;
  const payers=new Set(pay.filter(p=>!p.bal&&p.amt>0).map(p=>p.pid).filter(Boolean)).size;
  const avgS=sessions?net/sessions:null;
  return {k,rev,bal,refunds,net,opex,rent,sal,other:opex-rent-sal,profit,margin:net?profit/net:null,sessions,pts,payers,avgS,beS:avgS?Math.ceil(opex/avgS):null,

}

    const sum=[['البند','القيمة'],['الفرع',BRN[S.b]],['الفترة',`${S.from} الى ${S.to}`],['الإيرادات',T.rev],['المردودات',T.refunds],['صافي الإيراد',T.net],['المصروفات',T.opex],['صافي الربح',T.profit],['هامش الربح %',T.margin==null?'':+(T.margin*100).toFixed(1)],['الجلسات المكتملة',T.sessions],['متوسط الجلسة',T.avgS==null?'':Math.round(T.avgS)],['نقطة التعادل (جلسة/شهر)',T.beS??''],['آخر تحديث للبيانات',D.at||'']];
    const N=Object.values(ptIndex()).filter(p=>inR(p)&&!p.early);
    wbSave([['ملخص',sum],['الأرباح والخسائر',pl],['المصروفات حسب البند',[['البند','التفاصيل','المبلغ']].concat(groupSum(E,e=>e.type+'\u0001'+(e.info||'—')).map(([k,v])=>[...k.split('\u0001'),v]))],
      ['الإيرادات حسب الطريقة',[['الطريقة','المبلغ']].concat(groupSum(P,'meth'))],['الإيرادات حسب الدكتور',[['الدكتور','المبلغ']].concat(groupSum(P,'doc'))],
      ['المرضى الجداد حسب المصدر',[['المصدر','مرضى جداد','دفعوا']].concat(groupSum(N,p=>p.src||'مش متسجل',()=>1).map(([k,v])=>[k,v,N.filter(p=>(p.src||'مش متسجل')===k).reduce((s,p)=>s+(p.paid||0),0)]))],
      ['الإيرادات تفصيلي',revAoa()],['المصروفات تفصيلي',expAoa()],['المواعيد شهري',aptAoa()]],`تقرير BODYFIX ${per()}.xlsx`)}}

function vData(){const K=RAW.kinds||{},names={pay:'المدفوعات (Payments)',exp:'المصروفات (Expense payments)',inv:'الفواتير',apt:'المواعيد'};
  const all=monthsList(RAW.start||'2024-06',curK());
  let h=`<div class="card"><h3>حالة البيانات<small>آخر تحديث ${esc((RAW.at||'').replace('T',' ').slice(0,16))} UTC</small></h3>`;
  for(const kind in names){h+=`<h4 style="margin:12px 0 6px">${names[kind]}</h4>`;const bs=K[kind]||{};if(!Object.keys(bs).length){h+='<span class="chip w">لسه ما اتسحبتش</span>';continue}
    h+=tableHTML(['الفرع',{t:'شهور',n:1},{t:'صفوف',n:1},'ناقص'],Object.entries(bs).map(([b,ms])=>[esc(b==='all'?'كل الفروع':BRN[b]||b),Object.keys(ms).length,Object.values(ms).reduce((s,m)=>s+(m.rows||[]).length,0),all.filter(k=>!ms[k]).map(mls).join('، ')||'✓']))}
  return h+`<div class="note" style="margin-top:10px">المزامنة بتسحب الشهر الحالي واللي قبله كل مرة، وبتكمّل الشهور القديمة الناقصة شوية شوية لحد ما توصل لـ${ml(RAW.start||'2024-06')}.</div></div>`}

const VIEWS={sum:[vSum,cSum],pl:[vPL,cPL],rev:[vRev,cRev],exp:[vExp,cExp],pts:[vPts,cPts],ret:[vRet,cRet],apt:[vApt,cApt],debt:[vDebt,cDebt],cash:[vCash,cCash],dl:[vDL,bindDL],data:[vData,null]};
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  for(const k in CH){CH[k].destroy();delete CH[k]}
  const [v,c]=VIEWS[S.tab]||VIEWS.sum;
  try{$('#main').innerHTML=v();if(c)c()}catch(e){console.error(e);$('#main').innerHTML=`<div class="card">حصل خطأ في العرض: ${esc(e.message)}</div>`}
}
function setRange(a,b){S.from=a;S.to=b;$('#fFrom').value=a;$('#fTo').value=b;render()}
function start(){
  D=build(RAW);$('#lock').hidden=true;$('#app').hidden=false;
  const first=D.months[0]||RAW.start||'2024-06',last=curK();
  $('#asOf').textContent='آخر تحديث: '+(RAW.at?new Date(RAW.at).toLocaleString('ar-EG',{timeZone:'Africa/Cairo',dateStyle:'medium',timeStyle:'short'}):'—')+' · البيانات من '+ml(first);
  $('#fFrom').min=$('#fTo').min=first;$('#fFrom').max=$('#fTo').max=last;$('#fBranch').value=S.b;
  S.from=first;S.to=last;$('#fFrom').value=first;$('#fTo').value=last;render();
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(!b)return;S.tab=b.dataset.t;try{localStorage.setItem('fin_tab',S.tab)}catch(x){}render()});
$('#fBranch').onchange=e=>{S.b=e.target.value;try{localStorage.setItem('fin_b',S.b)}catch(x){}render()};
$('#fFrom').onchange=e=>{if(e.target.value){S.from=e.target.value;if(S.from>S.to)S.to=S.from,$('#fTo').value=S.to;render()}};
$('#fTo').onchange=e=>{if(e.target.value){S.to=e.target.value;if(S.to<S.from)S.from=S.to,$('#fFrom').value=S.from;render()}};
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const c=curK(),f=D.months[0]||c;const q=b.dataset.q;
  if(q==='m')setRange(c,c);else if(q==='3')setRange(shiftK(c,-2)<f?f:shiftK(c,-2),c);else if(q==='y')setRange((c.slice(0,4)+'-01')<f?f:c.slice(0,4)+'-01',c);else setRange(f,c)});
</script>
